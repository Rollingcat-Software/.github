name: Bug report
description: Report a reproducible defect (NOT a security vulnerability — use "Report a vulnerability")
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug. **Do not report security vulnerabilities here** — these
        repos are public and live. Use the "Report a vulnerability" link on the new-issue
        chooser (private GitHub Security Advisory) instead.
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      description: Which part of the system is affected?
      options:
        - identity (identity-core-api — Spring/Java)
        - web (web-app — React dashboard + hosted login)
        - bio (biometric-processor — FastAPI/Python)
        - spoof (spoof-detector / amispoof PAD)
        - mobile (client-apps — Kotlin Multiplatform)
        - infra (CI/CD / deploy / Traefik / host ops)
        - docs (docs site, landing, thesis, READMEs)
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Clear description including expected vs actual behavior.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit / image
      description: e.g. api image sha, web build hash, APK versionCode, or origin/main SHA.
    validations:
      required: false
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: OS, browser/runtime, deployment (local/staging/prod), tenant.
    validations:
      required: false
